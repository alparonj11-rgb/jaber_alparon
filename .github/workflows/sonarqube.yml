name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: windows-latest  # استخدمنا ويندوز لضمان توافقية بناء فلاتر

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # مطلوبة لكي يقوم SonarQube بتحليل تاريخ التغييرات بدقة

      # 2. تثبيت بيئة فلاتر Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. جلب الحزم وبناء المشروع محلياً لتوليد الملفات اللازمة للتحليل
      - name: Install dependencies & Analyze
        run: |
          flutter pub get
          flutter analyze

      # 4. تشغيل تحليل SonarQube
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ضع_مفتاح_المشروع_هنا
            -Dsonar.sources=.
